name: Release
on: [pull_request, workflow_dispatch]
jobs:
  release:
    # the tests run Windows exes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: marler8997/setup-anyzig@master
      - run: zig build release --summary all
      - name: getversion
        id: version
        shell: bash
        run: echo "version=$(cat zig-out/version-release)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: winbin-${{ steps.version.outputs.version }}-archives
          if-no-files-found: error
          path: |
            zig-out/winbin-x86_64.zip
            zig-out/winbin-aarch64.zip
            zig-out/winbin-x86.zip
